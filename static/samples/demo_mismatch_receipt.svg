<text x="405" y="173" text-anchor="end" font-size="11" font-weight="bold" fill="#0f172a">TOTAL</text>
<line x1="40" y1="181" x2="410" y2="181" stroke="#cbd5e1" stroke-width="1" />
<text x="45" y="201" font-size="11" fill="#1e293b">Hazelnut Cappuccino</text>
<text x="260" y="201" text-anchor="end" font-size="11" fill="#334155">2</text>
<text x="330" y="201" text-anchor="end" font-size="11" fill="#334155">₹180.00</text>
<text x="405" y="201" text-anchor="end" font-size="11" font-weight="bold" fill="#0f172a">₹360.00</text>
<text x="45" y="221" font-size="11" fill="#1e293b">Belgian Chocolate Cr..</text>
<text x="260" y="221" text-anchor="end" font-size="11" fill="#334155">1</text>
<text x="330" y="221" text-anchor="end" font-size="11" fill="#334155">₹160.00</text>
<text x="405" y="221" text-anchor="end" font-size="11" font-weight="bold" fill="#0f172a">₹160.00</text>
<line x1="40" y1="246" x2="410" y2="246" stroke="#cbd5e1" stroke-width="1" />
<text x="45" y="268" font-size="11" fill="#475569">Subtotal:</text>
<text x="405" y="268" text-anchor="end" font-size="11" fill="#1e293b">₹520.00</text>
<text x="45" y="286" font-size="11" fill="#475569">CGST @ 2.5%:</text>
<text x="405" y="286" text-anchor="end" font-size="11" fill="#1e293b">₹13.00</text>
<text x="45" y="304" font-size="11" fill="#475569">SGST @ 2.5%:</text>
<text x="405" y="304" text-anchor="end" font-size="11" fill="#1e293b">₹13.00</text>
<text x="45" y="322" font-size="11" fill="#475569">Tip / Gratuity:</text>
<text x="405" y="322" text-anchor="end" font-size="11" fill="#1e293b">₹20.00</text>
<line x1="40" y1="348" x2="410" y2="348" stroke="#0f172a" stroke-width="1.5" />
<text x="45" y="372" font-size="15" font-weight="bold" fill="#0f172a">GRAND TOTAL:</text>
<text x="405" y="372" text-anchor="end" font-size="16" font-weight="bold" fill="#0f172a">₹620.00</text>
<line x1="40" y1="397" x2="410" y2="397" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1" />
<text x="225" y="419" text-anchor="middle" font-size="10" fill="#64748b">* Handwritten manual adjustment fee *</text>
<text x="225" y="435" text-anchor="middle" font-size="10" fill="#64748b">Paid by Cash</text>

        <g transform="translate(130, 461)">
