<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 720" width="450" height="720" style="background:#ffffff; font-family: 'Courier New', Courier, monospace; color: #1e293b;">
    <defs>
        
        <filter id="heavy-blur">
            <feGaussianBlur stdDeviation="7" />
        </filter>
        
        <pattern id="paper-texture" width="10" height="10" patternUnits="userSpaceOnUse">
            <rect width="10" height="10" fill="#fcfbf7" />
            <circle cx="2" cy="2" r="0.5" fill="#e2e8f0" opacity="0.4"/>
            <circle cx="7" cy="7" r="0.5" fill="#cbd5e1" opacity="0.3"/>
        </pattern>
        <filter id="paper-shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15" />
        </filter>
    </defs>
    
    <g filter="url(#heavy-blur)" filter="url(#paper-shadow)">
        <!-- Receipt Paper -->
        <rect x="20" y="20" width="410" height="680" rx="4" fill="url(#paper-texture)" stroke="#e2e8f0" stroke-width="1.5" />
        
        <!-- Serrated top/bottom receipt edge simulation -->
        <path d="M 20 20 L 430 20 L 430 25 L 20 25 Z" fill="#f1f5f9" />
        
        <!-- Header -->
        <text x="225" y="65" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">UNREADABLE RECEIPT</text>
        <text x="225" y="85" text-anchor="middle" font-size="12" fill="#475569">Sample Blurry Document for Error Handling</text>
    <text x="225" y="110" text-anchor="middle" font-size="11" fill="#64748b">[BLURRY TEXT]</text>
<text x="225" y="128" text-anchor="middle" font-size="11" fill="#64748b">[MOTION BLUR ARTIFACT]</text>
<line x1="40" y1="151" x2="410" y2="151" stroke="#0f172a" stroke-dasharray="4,3" stroke-width="1" />
<text x="45" y="173" font-size="11" font-weight="bold" fill="#0f172a">ITEM</text>
<text x="260" y="173" text-anchor="end" font-size="11" font-weight="bold" fill="#0f172a">QTY</text>
<text x="330" y="173" text-anchor="end" font-size="11" font-weight="bold" fill="#0f172a">PRICE</text>
<text x="405" y="173" text-anchor="end" font-size="11" font-weight="bold" fill="#0f172a">TOTAL</text>
<line x1="40" y1="181" x2="410" y2="181" stroke="#cbd5e1" stroke-width="1" />
<text x="45" y="201" font-size="11" fill="#1e293b">Unknown Scrambled Line</text>
<text x="260" y="201" text-anchor="end" font-size="11" fill="#334155">1</text>
<text x="330" y="201" text-anchor="end" font-size="11" fill="#334155">₹99.00</text>
<text x="405" y="201" text-anchor="end" font-size="11" font-weight="bold" fill="#0f172a">₹99.00</text>
<line x1="40" y1="226" x2="410" y2="226" stroke="#cbd5e1" stroke-width="1" />
<text x="45" y="248" font-size="11" fill="#475569">Subtotal:</text>
<text x="405" y="248" text-anchor="end" font-size="11" fill="#1e293b">₹99.00</text>
<text x="45" y="266" font-size="11" fill="#475569">TAX:</text>
<text x="405" y="266" text-anchor="end" font-size="11" fill="#1e293b">₹5.00</text>
<line x1="40" y1="292" x2="410" y2="292" stroke="#0f172a" stroke-width="1.5" />
<text x="45" y="316" font-size="15" font-weight="bold" fill="#0f172a">GRAND TOTAL:</text>
<text x="405" y="316" text-anchor="end" font-size="16" font-weight="bold" fill="#0f172a">₹104.00</text>
<line x1="40" y1="341" x2="410" y2="341" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1" />
<text x="225" y="363" text-anchor="middle" font-size="10" fill="#64748b">Image quality too degraded for OCR/AI extraction</text>

        <g transform="translate(130, 389)">
            <rect x="0" y="0" width="3" height="30" fill="#0f172a" />
            <rect x="6" y="0" width="2" height="30" fill="#0f172a" />
            <rect x="12" y="0" width="4" height="30" fill="#0f172a" />
            <rect x="20" y="0" width="2" height="30" fill="#0f172a" />
            <rect x="26" y="0" width="5" height="30" fill="#0f172a" />
            <rect x="35" y="0" width="2" height="30" fill="#0f172a" />
            <rect x="42" y="0" width="4" height="30" fill="#0f172a" />
            <rect x="50" y="0" width="1" height="30" fill="#0f172a" />
            <rect x="56" y="0" width="6" height="30" fill="#0f172a" />
            <rect x="68" y="0" width="2" height="30" fill="#0f172a" />
            <rect x="74" y="0" width="3" height="30" fill="#0f172a" />
            <rect x="82" y="0" width="5" height="30" fill="#0f172a" />
            <rect x="92" y="0" width="2" height="30" fill="#0f172a" />
            <rect x="98" y="0" width="4" height="30" fill="#0f172a" />
            <rect x="108" y="0" width="3" height="30" fill="#0f172a" />
            <rect x="116" y="0" width="5" height="30" fill="#0f172a" />
            <rect x="126" y="0" width="2" height="30" fill="#0f172a" />
            <rect x="134" y="0" width="4" height="30" fill="#0f172a" />
            <rect x="144" y="0" width="6" height="30" fill="#0f172a" />
            <rect x="156" y="0" width="2" height="30" fill="#0f172a" />
            <rect x="164" y="0" width="5" height="30" fill="#0f172a" />
            <rect x="174" y="0" width="2" height="30" fill="#0f172a" />
            <rect x="180" y="0" width="4" height="30" fill="#0f172a" />
        </g>
    </g>
</svg>